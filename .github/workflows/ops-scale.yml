name: Ops - CloudBase Scale

# 手动触发：GitHub 仓库 → Actions → "Ops - CloudBase Scale" → Run workflow
# 用于查看/调整线上 angel 服务的副本数（默认建议固定 1 个实例）
on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作类型'
        required: true
        default: 'status'
        type: choice
        options:
          - status        # 只查询当前副本配置
          - fix-one       # 固定为 1 个实例（MinNum=1, MaxNum=1）
      environment:
        description: '目标环境 (envId)'
        required: true
        default: 'angel-d2gws9dnv51db45e2'

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Query / Update replicas
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TCB_SERVER_NAME: angel
          TCB_REGION: ap-shanghai
          TCB_ENV_ID: ${{ inputs.environment }}
        run: |
          if [ "${{ inputs.action }}" = "fix-one" ]; then
            python3 deploy/tcb_scale.py --fix-one
          else
            python3 deploy/tcb_scale.py --status
          fi
